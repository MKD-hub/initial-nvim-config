# ~/.config/nvim/stylua.toml

# 1. Width: Increasing this keeps more code on a single line
column_width = 120

# 2. Line Endings: Standardize to Unix to prevent odd spacing issues
line_endings = "Unix"

# 3. Indentation: Standard 4 spaces
indent_type = "Spaces"
indent_width = 4

# 4. Quotes: "AutoPreferDouble" is standard for Lua, change to "AutoPreferSingle" if you prefer ' '
quote_style = "AutoPreferDouble"

# 5. COMPACTNESS SETTINGS (The important part for you)

# "Always" keeps simple logic (like short if-statements) on one line.
collapse_simple_statement = "Always"

# "None" or "NoSingleString" prevents simple function calls like require('lspconfig') 
# from breaking into 3 lines.
call_parentheses = "None" 
